<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;font-family:var(--font-doc);background:#fff;}
.sw{display:grid;gap:6px;}.ch{height:44px;border:1px solid var(--line-table);}
.lb{font-size:8.5pt;color:var(--ink-400);}</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;">
  <div class="sw"><div class="ch" style="background:var(--ink-900)"></div><div class="lb">900 제목</div></div>
  <div class="sw"><div class="ch" style="background:var(--ink-800)"></div><div class="lb">800 본문</div></div>
  <div class="sw"><div class="ch" style="background:var(--ink-700)"></div><div class="lb">700 각주</div></div>
  <div class="sw"><div class="ch" style="background:var(--ink-600)"></div><div class="lb">600 도해선</div></div>
  <div class="sw"><div class="ch" style="background:var(--ink-500)"></div><div class="lb">500 보조</div></div>
  <div class="sw"><div class="ch" style="background:var(--ink-400)"></div><div class="lb">400 캡션</div></div>
  <div class="sw"><div class="ch" style="background:var(--ink-300)"></div><div class="lb">300 쪽번호</div></div>
</div>
</body></html>
