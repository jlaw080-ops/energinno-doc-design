<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;font-family:var(--font-doc);background:#fff;}
.row{display:flex;gap:8px;align-items:baseline;font-size:var(--size-toc-item);color:var(--ink-800);}
.num{width:2em;flex:none;}
.dot{flex:1;border-bottom:1px dotted var(--line-dot);transform:translateY(-3px);}</style>
</head><body>
<div style="border:1px solid var(--line-table);padding:16px 20px;">
  <div style="font-size:var(--size-toc-title);font-weight:var(--weight-bold);color:var(--ink-900);letter-spacing:4pt;text-align:center;margin-bottom:14px;">목 차</div>
  <div style="display:grid;gap:9px;">
    <div class="row"><span class="num">1.</span><span>시스템 컨셉</span><span class="dot"></span><span>1</span></div>
    <div class="row"><span class="num">2.</span><span>시스템 구조</span><span class="dot"></span><span>3</span></div>
    <div class="row"><span class="num">3.</span><span>역할 분담</span><span class="dot"></span><span>6</span></div>
  </div>
</div>
</body></html>
