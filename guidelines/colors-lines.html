<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;font-family:var(--font-doc);background:#fff;}
.lb{font-size:8.5pt;color:var(--ink-400);margin-top:6px;}
.ch{height:38px;border:1px solid var(--line-table);}</style>
</head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">
  <div>
    <div style="display:grid;gap:7px;">
      <div style="border-top:1.5px solid var(--line-strong);"></div>
      <div style="border-top:1px solid var(--line-mid);"></div>
      <div style="border-top:1px solid var(--line-table);"></div>
      <div style="border-top:1px solid var(--line-soft);"></div>
    </div>
    <div class="lb">선: 장 제목 · 도해 테두리 · 표 격자 · 머리말</div>
  </div>
  <div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
      <div class="ch" style="background:var(--surface-page)"></div>
      <div class="ch" style="background:var(--surface-note)"></div>
      <div class="ch" style="background:var(--surface-fill-1)"></div>
      <div class="ch" style="background:var(--surface-fill-3)"></div>
    </div>
    <div class="lb">면: 지면 · 각주 박스 · 도해 채움 · 강조 채움</div>
  </div>
</div>
</body></html>
